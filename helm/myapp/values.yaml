replicaCount: 2

image:
  repository: ghcr.io/agern28/devops-internship-week3-4
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: myapp.local
  path: /
  pathType: Prefix

# APP_VERSION deliberately absent: it belongs to the image, not to config.
config:
  LOG_LEVEL: debug

secret:
  # Never committed. Provide at install time:
  #   helm install ... --set secret.API_KEY='...'
  API_KEY: ""

# Requests are what the scheduler reserves and what the HPA measures
# utilisation against. Limits are the hard ceiling.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  # Slow-start guard: liveness does not begin until this passes.
  startup:
    path: /healthz
    periodSeconds: 2
    failureThreshold: 30
  # Is the process alive? Failing this restarts the container.
  liveness:
    path: /healthz
    periodSeconds: 10
    failureThreshold: 3
  # Can it serve traffic? Failing this removes it from the Service.
  readiness:
    path: /ready
    periodSeconds: 2
    failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
