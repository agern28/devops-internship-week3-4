replicaCount: 2

image:
  repository: ghcr.io/agern28/devops-internship-week3-4
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: myapp.local
  path: /
  pathType: Prefix

# APP_VERSION deliberately absent: it belongs to the image, not to config.
config:
  LOG_LEVEL: debug

secret:
  # Never committed. Provide at install time:
  #   helm install ... --set secret.API_KEY='...'
  API_KEY: ""

# Probes, resource limits and autoscaling arrive on day 19.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
