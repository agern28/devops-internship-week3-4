# Day 16 — minimal Deployment. Config, secrets, probes and limits
# arrive on days 17 and 19.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: app
  labels:
    app: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/agern28/devops-internship-week3-4:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
