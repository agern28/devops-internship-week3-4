# Day 16 + 17 — Deployment with config and secrets injected.
# Probes and resource limits arrive on day 19.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: app
  labels:
    app: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/agern28/devops-internship-week3-4:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Day 17 — non-sensitive config as environment variables
          envFrom:
            - configMapRef:
                name: app-config
          # Day 17 — sensitive value, referenced not inlined
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: API_KEY
